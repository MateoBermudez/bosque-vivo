[project]
name = "bosquevivo"
version = "0.1.0"
description = "Auditoría satelital de proyectos de carbono forestal con asistente de IA"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "shapely>=2.0",
    "pyproj>=3.7",
    "numpy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "fpdf2>=2.8",
    "structlog>=24.4",
    "rapidfuzz>=3.10",
    "google-genai>=1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
procesamiento = [
    "uvicorn[standard]>=0.32",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "scipy>=1.14",
    "pymannkendall>=1.4",
    "matplotlib>=3.9",
    "earthengine-api>=1.0",
    "rasterio>=1.5.2",
    "pystac-client>=0.9.1",
    "planetary-computer>=1.0.0",
]

[project.scripts]
bosquevivo = "bosquevivo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosquevivo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/bosquevivo/ai/prompts/*" = ["E501"]
"tests/*" = ["PLR2004", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "RUF012", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: pruebas con base de datos en memoria",
    "golden: polígonos de validación con resultados esperados",
    "eval: evaluación del agente de IA",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
